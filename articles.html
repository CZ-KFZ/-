<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="文章 — 阴之体道关于设计、技术、生活与思考的长期记录。" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>文章 · EchoVerse</title>
</head>
<body class="min-h-screen antialiased">
  <div id="evo-header"></div>

  <main class="pt-16">
    <section class="max-w-5xl mx-auto px-5 sm:px-6 py-8 sm:py-10">
      <div class="text-center mb-8 sm:mb-10 evo-reveal">
        <p class="text-xs uppercase tracking-[0.3em] text-[var(--evo-ink-3)] mb-3">ARTICLES</p>
        <h1 class="evo-display text-2xl sm:text-3xl md:text-4xl mb-3 bg-gradient-to-r from-[var(--evo-purple-300)] via-[var(--evo-ink)] to-[var(--evo-cyan)] bg-clip-text text-transparent">文章</h1>
        <p class="text-sm text-[var(--evo-ink-3)]">设计、技术、生活与思考的长期记录</p>
      </div>

      <!-- 子栏目入口（由 articles.js 渲染） -->
      <div id="evo-articles-list"></div>

      <div id="evo-articles-empty" class="hidden text-center py-16 text-[var(--evo-ink-3)]">
        <p class="text-lg mb-2">📭</p>
        <p>这个分类下还没有文章。</p>
      </div>
    </section>
  </main>

  <div id="evo-footer"></div>

  <script type="module" src="/src/scripts/main.js"></script>
  <script type="module" src="/src/scripts/pages/articles.js"></script>
</body>
</html>
