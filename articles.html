<!DOCTYPE html>
<html lang="zh-CN" class="dark"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="文章 — 阴之体道关于设计、技术、生活与思考的长期记录。">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>文章 · EchoVerse</title>
</head>
<body class="min-h-screen antialiased">
  <div id="evo-header"></div>

  <main class="pt-16">
    <section class="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
      <div class="text-center mb-8 sm:mb-10 evo-reveal">
        <p class="text-xs uppercase tracking-[0.3em] text-[var(--evo-ink-3)] mb-3">ARTICLES</p>
        <h1 class="evo-display text-3xl sm:text-4xl md:text-5xl mb-3 bg-gradient-to-r from-[var(--evo-purple-300)] via-[var(--evo-ink)] to-[var(--evo-cyan)] bg-clip-text text-transparent">文章</h1>
        <p class="text-sm text-[var(--evo-ink-3)]">设计、技术、生活与思考的长期记录</p>
      </div>

      <!-- 搜索框 -->
      <div class="flex justify-center mb-8">
        <div class="relative w-64">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--evo-ink-3)]" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="evo-articles-search" type="text" placeholder="搜索文章…" class="w-full pl-9 pr-8 py-2 rounded-full bg-[var(--evo-surface-2)]/60 border border-[var(--evo-border)] text-[var(--evo-ink)] placeholder:text-[var(--evo-ink-3)] focus:outline-none focus:ring-1 focus:ring-[var(--evo-purple-400)]/50 transition-all text-xs">
          <button id="evo-articles-search-clear" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-[var(--evo-ink-3)] hover:text-[var(--evo-ink)] transition-colors" aria-label="清除">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>

      <!-- 子栏目入口（由 articles.js 渲染） -->
      <div id="evo-articles-list"></div>

      <div id="evo-articles-empty" class="hidden text-center py-16 text-[var(--evo-ink-3)]">
        <p class="text-lg mb-2">📭</p>
        <p>这个分类下还没有文章。</p>
      </div>
    </section>
  </main>

  <div id="evo-footer"></div>

  <script type="module" src="#"></script>
  <script type="module" src="#"></script>


</body></html>
