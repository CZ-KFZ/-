<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="精选合集 — 系列文章打包阅读，每个合集独立标记免费或付费。" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>精选合集 · EchoVerse</title>
</head>
<body class="min-h-screen antialiased">
  <div id="evo-header"></div>

  <main class="pt-16">
    <section class="max-w-7xl mx-auto px-5 sm:px-6 py-8 sm:py-8">
      <!-- 页面头部 -->
      <div class="mb-6 sm:mb-8 evo-reveal">
        <h1 class="evo-display text-2xl sm:text-3xl mb-2">精选合集</h1>
        <p id="evo-collections-subtitle" class="text-sm text-[var(--evo-ink-3)]">系列文章打包阅读，每个合集独立定价</p>
      </div>

      <!-- 统计栏 -->
      <div id="evo-collections-stats" class="flex flex-wrap gap-3 mb-6 evo-reveal" data-reveal-delay="80">
        <!-- 由 garden.js 渲染 -->
      </div>

      <!-- 合集列表 -->
      <div id="evo-collections-list" class="grid gap-5 sm:gap-5 grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
        <div class="col-span-full text-center py-16 text-[var(--evo-ink-3)] text-sm">加载中…</div>
      </div>
    </section>
  </main>

  <div id="evo-footer"></div>

  <script type="module" src="/src/scripts/main.js"></script>
  <script type="module" src="/src/scripts/pages/garden.js"></script>
</body>
</html>
