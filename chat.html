<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="和 Echo 对话 — 阴之体道的数字分身，基于她的知识库回答关于作品、经历、思考的问题。" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>对话 · EchoVerse</title>
</head>
<body class="min-h-screen antialiased">
  <div id="evo-header"></div>

  <main class="pt-16">
    <section class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
      <div class="grid lg:grid-cols-[280px_1fr] gap-6 min-h-[calc(100vh-180px)]">
        <!-- 左侧：对话历史 + 知识库 -->
        <aside id="evo-chat-aside" class="hidden lg:block evo-glass-strong rounded-[var(--evo-radius-lg)] p-4 h-fit">
          <!-- 由 chat.js 渲染 -->
        </aside>

        <!-- 右侧：对话主区 -->
        <div class="flex flex-col evo-glass-strong rounded-[var(--evo-radius-lg)] overflow-hidden min-h-[600px]">
          <!-- 对话头部 -->
          <div class="p-4 border-b border-[var(--evo-border)] flex items-center gap-3">
            <button id="evo-chat-history-btn" class="lg:hidden w-9 h-9 rounded-[var(--evo-radius-md)] evo-glass flex items-center justify-center text-[var(--evo-ink-2)] hover:text-[var(--evo-ink)] transition-colors" aria-label="历史对话">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
            <button id="evo-persona-btn" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
              <div id="evo-chat-header-avatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-[var(--evo-purple-400)] to-[var(--evo-pink)] flex items-center justify-center text-white text-sm font-bold">E</div>
            </button>
            <div class="flex-1 min-w-0">
              <div class="evo-title truncate">Echo · 数字分身</div>
              <div class="text-xs text-[var(--evo-state-success)] flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-[var(--evo-state-success)] evo-animate-pulse"></span>
                <span id="evo-chat-status">在线 · 基于我的知识库</span>
              </div>
            </div>
            <!-- 风格切换 -->
            <div class="hidden sm:flex items-center gap-1 mr-2">
              <button data-style="normal" class="style-btn px-2 py-1 rounded text-xs text-[var(--evo-ink-2)] hover:bg-[var(--evo-surface-2)] transition-colors" title="正式">正式</button>
              <button data-style="casual" class="style-btn px-2 py-1 rounded text-xs text-[var(--evo-ink-2)] hover:bg-[var(--evo-surface-2)] transition-colors" title="日常">日常</button>
              <button data-style="poetic" class="style-btn px-2 py-1 rounded text-xs text-[var(--evo-ink-2)] hover:bg-[var(--evo-surface-2)] transition-colors" title="诗意">诗意</button>
            </div>
            <!-- 主题切换 -->
            <button id="evo-theme-toggle" class="w-8 h-8 rounded-[var(--evo-radius-md)] evo-glass flex items-center justify-center text-[var(--evo-ink-2)] hover:text-[var(--evo-ink)] transition-colors" title="切换主题">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
            <!-- 知识图谱 -->
            <button id="evo-graph-btn" class="w-8 h-8 rounded-[var(--evo-radius-md)] evo-glass flex items-center justify-center text-[var(--evo-ink-2)] hover:text-[var(--evo-ink)] transition-colors" title="知识图谱">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><line x1="12" y1="9" x2="6" y2="7"/><line x1="12" y1="9" x2="18" y2="7"/><line x1="12" y1="15" x2="6" y2="17"/><line x1="12" y1="15" x2="18" y2="17"/></svg>
            </button>
          </div>

          <!-- 消息列表 -->
          <div id="evo-chat-messages" class="flex-1 p-4 sm:p-6 space-y-6 overflow-y-auto">
            <!-- 由 chat.js 渲染 -->
          </div>

          <!-- 输入区 -->
          <div class="p-4 border-t border-[var(--evo-border)]">
            <div class="flex flex-wrap gap-2 mb-3" id="evo-quick-prompts">
              <!-- 由 chat.js 渲染 -->
            </div>
            <div class="relative">
              <!-- Slash 指令菜单 -->
              <div id="evo-slash-menu" class="hidden absolute bottom-full left-0 right-0 mb-2 evo-glass-strong rounded-[var(--evo-radius-md)] border border-[var(--evo-border)] overflow-hidden z-20"></div>
              <form id="evo-chat-form" class="flex gap-3 items-end">
                <div class="flex-1 relative">
                  <textarea
                    id="evo-chat-input"
                    rows="1"
                    placeholder="向 Echo 提问...（输入 / 查看快捷指令，Shift+Enter 换行）"
                    autocomplete="off"
                    class="w-full resize-none bg-[var(--evo-surface-2)] border border-[var(--evo-border-glow)] rounded-[var(--evo-radius-md)] px-4 py-3 pr-16 text-sm text-[var(--evo-ink)] placeholder:text-[var(--evo-ink-3)] focus:outline-none focus:ring-2 focus:ring-[var(--evo-purple-400)] focus:border-[var(--evo-border-glow-strong)] transition-all max-h-32"
                  ></textarea>
                  <div class="absolute right-3 bottom-2 flex items-center gap-2">
                    <span id="evo-char-count" class="text-xs text-[var(--evo-ink-3)]">0</span>
                    <button type="button" id="evo-mic-btn" class="w-7 h-7 rounded-full flex items-center justify-center text-[var(--evo-ink-3)] hover:text-[var(--evo-purple-300)] transition-colors" title="语音输入">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                    </button>
                  </div>
                </div>
                <button type="submit" class="px-4 sm:px-5 py-3 rounded-[var(--evo-radius-md)] bg-gradient-to-r from-[var(--evo-purple-500)] to-[var(--evo-cyan)] text-white text-sm font-medium hover:opacity-90 transition-all evo-glow-purple flex items-center gap-2 self-end">
                  <span>发送</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 移动端历史抽屉遮罩 -->
  <div id="evo-chat-overlay" class="evo-drawer-overlay lg:hidden"></div>

  <!-- 人设面板 Modal -->
  <div id="evo-persona-modal" class="hidden fixed inset-0 z-[80] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" data-close-persona></div>
    <div class="relative evo-glass-strong rounded-[var(--evo-radius-lg)] p-6 max-w-md w-full max-h-[80vh] overflow-y-auto border border-[var(--evo-border)]">
      <button data-close-persona class="absolute top-3 right-3 w-8 h-8 rounded-full evo-glass flex items-center justify-center text-[var(--evo-ink-2)] hover:text-[var(--evo-ink)]">✕</button>
      <div id="evo-persona-content"></div>
    </div>
  </div>

  <!-- 知识图谱 Modal -->
  <div id="evo-graph-modal" class="hidden fixed inset-0 z-[80] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" data-close-graph></div>
    <div class="relative evo-glass-strong rounded-[var(--evo-radius-lg)] p-6 max-w-2xl w-full max-h-[80vh] overflow-hidden border border-[var(--evo-border)]">
      <button data-close-graph class="absolute top-3 right-3 z-10 w-8 h-8 rounded-full evo-glass flex items-center justify-center text-[var(--evo-ink-2)] hover:text-[var(--evo-ink)]">✕</button>
      <h3 class="evo-title text-lg mb-4">知识图谱</h3>
      <canvas id="evo-graph-canvas" class="w-full rounded-[var(--evo-radius-md)]" style="height:500px;"></canvas>
    </div>
  </div>

  <div id="evo-footer"></div>

  <script type="module" src="/src/scripts/main.js"></script>
  <script type="module" src="/src/scripts/pages/chat.js"></script>
</body>
</html>
