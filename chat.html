<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="和 Echo 对话 — 阴之体道的数字分身，基于她的知识库回答关于作品、经历、思考的问题。" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>对话 · EchoVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    .font-serif-instrument { font-family: 'Instrument Serif', serif; }
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }
    /* 消息气泡 */
    .msg-bubble-echo {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-left: 3px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.9);
      border-top-left-radius: 4px;
    }
    .msg-bubble-user {
      background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    /* 滚动条 */
    .chat-scroll::-webkit-scrollbar { width: 4px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    /* 打字动画 */
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); display: inline-block; margin: 0 2px; animation: typingBounce 1.4s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }
    /* 消息入场 */
    @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .msg-anim { animation: msgIn 0.35s ease-out; }
  </style>
</head>
<body class="min-h-screen antialiased bg-black text-white">
  <div id="evo-header"></div>

  <main class="pt-16">
    <section class="max-w-3xl mx-auto px-4 sm:px-6 py-6">
      <!-- 聊天头部 -->
      <div class="flex items-center justify-between pb-4 border-b border-white/10 mb-4">
        <h1 class="font-serif-instrument text-xl text-white">对话 · Echo <small class="text-sm text-white/40 font-sans ml-1">与数字分身交流</small></h1>
        <button id="evo-new-chat" class="flex items-center gap-1.5 liquid-glass rounded-full px-4 py-2 text-xs text-white/70 hover:text-white hover:bg-white/5 transition-all">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新建对话
        </button>
      </div>

      <!-- 快捷引导卡片 -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4" id="evo-quick-cards">
        <!-- 由 chat.js 渲染 -->
      </div>

      <!-- 聊天消息区 -->
      <div id="evo-chat-messages" class="chat-scroll flex-1 overflow-y-auto space-y-4 mb-4" style="max-height: calc(100vh - 320px); min-height: 280px;">
        <!-- 由 chat.js 渲染 -->
      </div>

      <!-- 输入区 -->
      <div class="relative">
        <div class="flex items-end gap-2 liquid-glass rounded-full px-4 py-2 transition-all" id="evo-input-wrap">
          <textarea
            id="evo-chat-input"
            rows="1"
            placeholder="输入你想了解的内容…"
            autocomplete="off"
            class="flex-1 bg-transparent border-none outline-none resize-none text-sm text-white placeholder:text-white/30 py-1.5"
            style="max-height: 100px;"
          ></textarea>
          <button id="evo-chat-send" class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center shrink-0 transition-all hover:scale-105 active:scale-95" aria-label="发送">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>

      <!-- 页脚 -->
      <footer class="text-center pt-4 pb-3 border-t border-white/10 mt-4">
        <p class="text-xs text-white/30">© 2026 阴之体道 · 个人数字化空间站</p>
      </footer>
    </section>
  </main>

  <div id="evo-footer"></div>

  <script type="module" src="/src/scripts/main.js"></script>
  <script type="module" src="/src/scripts/pages/chat.js"></script>
</body>
</html>
