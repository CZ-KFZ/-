<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EchoVerse · 个人数字化空间站" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>首页 · EchoVerse</title>
</head>
<body class="min-h-screen antialiased">
  <!-- 共享 Header（由 main.js 注入） -->
  <div id="evo-header"></div>

  <main class="pt-16">
    <!-- ===================================================
         Hero · 首屏
         =================================================== -->
    <section class="relative min-h-[calc(100vh-64px)] flex flex-col items-center justify-center overflow-hidden px-6 py-16">
      <!-- 3D Canvas 背景层（Three.js）—— 可交互：拖拽旋转、滚轮缩放 -->
      <div id="evo-three-canvas" class="absolute inset-0" style="z-index: 0;"></div>

      <!-- 文字浮层：pointer-events-none 让鼠标事件穿透到 3D canvas，只有按钮可点 -->
      <div class="relative z-10 text-center max-w-4xl mx-auto pointer-events-none mt-[-60px]">
        <h1 class="evo-display text-4xl sm:text-5xl md:text-7xl mb-6 evo-reveal drop-shadow-[0_0_30px_rgba(168,85,247,0.5)]" data-reveal-delay="100">
          你好，我是 <span id="evo-home-doppelganger-name" class="evo-gradient-text">Echo</span>
        </h1>
        <p id="evo-home-hero-desc" class="evo-body text-base sm:text-lg md:text-xl text-[var(--evo-ink-2)] mb-10 max-w-2xl mx-auto evo-reveal" data-reveal-delay="200">
          她是我的数字分身，可以回答关于我的一切。在这里，作品、文章、思考被编织成一张可探索的知识网络。
        </p>
        <a href="chat.html" data-dom-id="cta-chat" class="inline-flex items-center gap-2 px-6 sm:px-8 py-3 sm:py-4 rounded-[var(--evo-radius-lg)] bg-gradient-to-r from-[var(--evo-purple-500)] to-[var(--evo-cyan)] text-white font-medium text-base sm:text-lg hover:opacity-90 transition-all hover:-translate-y-0.5 evo-glow-purple evo-reveal pointer-events-auto" data-reveal-delay="300">
          和 <span id="evo-home-doppelganger-name-2">Echo</span> 聊聊 <span aria-hidden="true">→</span>
        </a>
      </div>

      <!-- 四大入口轨道卡片 -->
      <div class="relative z-10 mt-auto w-full max-w-5xl mx-auto pointer-events-auto">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
          <a href="portfolio.html" data-dom-id="orbit-portfolio" class="group evo-glass rounded-[var(--evo-radius-lg)] p-4 sm:p-6 text-center hover:bg-[var(--evo-surface-2)] transition-all hover:scale-[1.02] evo-card-hover evo-reveal" data-reveal-delay="400">
            <div class="w-12 h-12 mx-auto mb-4 rounded-[var(--evo-radius-md)] bg-[var(--evo-purple-500)]/20 flex items-center justify-center text-2xl group-hover:evo-glow-purple transition-all">🎨</div>
            <h3 class="evo-title text-base sm:text-lg mb-1">作品集</h3>
            <p id="evo-home-count-projects" class="text-xs sm:text-sm text-[var(--evo-ink-3)]">— 个项目</p>
          </a>
          <a href="articles.html" data-dom-id="orbit-articles" class="group evo-glass rounded-[var(--evo-radius-lg)] p-4 sm:p-6 text-center hover:bg-[var(--evo-surface-2)] transition-all hover:scale-[1.02] evo-card-hover evo-reveal" data-reveal-delay="500">
            <div class="w-12 h-12 mx-auto mb-4 rounded-[var(--evo-radius-md)] bg-[var(--evo-cyan)]/20 flex items-center justify-center text-2xl group-hover:evo-glow-cyan transition-all">✍️</div>
            <h3 class="evo-title text-base sm:text-lg mb-1">文章</h3>
            <p id="evo-home-count-articles" class="text-xs sm:text-sm text-[var(--evo-ink-3)]">— 篇长文</p>
          </a>
          <a href="garden.html" data-dom-id="orbit-garden" class="group evo-glass rounded-[var(--evo-radius-lg)] p-4 sm:p-6 text-center hover:bg-[var(--evo-surface-2)] transition-all hover:scale-[1.02] evo-card-hover evo-reveal" data-reveal-delay="600">
            <div class="w-12 h-12 mx-auto mb-4 rounded-[var(--evo-radius-md)] bg-[var(--evo-pink)]/20 flex items-center justify-center text-2xl group-hover:evo-glow-pink transition-all">🌱</div>
            <h3 class="evo-title text-base sm:text-lg mb-1">数字花园</h3>
            <p id="evo-home-count-notes" class="text-xs sm:text-sm text-[var(--evo-ink-3)]">— 条笔记</p>
          </a>
          <a href="about.html" data-dom-id="orbit-about" class="group evo-glass rounded-[var(--evo-radius-lg)] p-4 sm:p-6 text-center hover:bg-[var(--evo-surface-2)] transition-all hover:scale-[1.02] evo-card-hover evo-reveal" data-reveal-delay="700">
            <div class="w-12 h-12 mx-auto mb-4 rounded-[var(--evo-radius-md)] bg-[var(--evo-violet)]/20 flex items-center justify-center text-2xl group-hover:evo-glow-purple transition-all">👤</div>
            <h3 class="evo-title text-base sm:text-lg mb-1">关于我</h3>
            <p id="evo-home-count-owner" class="text-xs sm:text-sm text-[var(--evo-ink-3)]">—</p>
          </a>
        </div>
      </div>

      <!-- 交互提示 -->
      <div class="relative z-10 mt-6 text-xs text-[var(--evo-ink-3)] evo-reveal flex items-center gap-2 opacity-70 pointer-events-none" data-reveal-delay="800">
        <span>🖱️</span>
        <span>拖动旋转 · 滚轮缩放 · 3D 空间站</span>
      </div>
    </section>

    <!-- ===================================================
         精选内容区块
         =================================================== -->
    <section class="relative px-6 py-20 sm:py-28">
      <div class="max-w-6xl mx-auto">
        <div class="flex items-end justify-between mb-10 evo-reveal">
          <div>
            <p class="text-sm text-[var(--evo-purple-300)] mb-2 tracking-widest">— FEATURED</p>
            <h2 class="evo-display text-3xl sm:text-4xl">精选作品</h2>
          </div>
          <a href="portfolio.html" class="hidden sm:inline-flex items-center gap-1 text-sm text-[var(--evo-ink-3)] hover:text-[var(--evo-purple-300)] transition-colors">查看全部 →</a>
        </div>
        <div id="evo-home-featured" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
          <!-- 由 home.js 渲染 -->
          <div class="col-span-full text-center py-12 text-[var(--evo-ink-3)]">加载中…</div>
        </div>
      </div>
    </section>

    <section class="relative px-6 py-16 sm:py-24 bg-gradient-to-b from-transparent via-[var(--evo-surface)]/40 to-transparent">
      <div class="max-w-6xl mx-auto">
        <div class="flex items-end justify-between mb-10 evo-reveal">
          <div>
            <p class="text-sm text-[var(--evo-cyan)] mb-2 tracking-widest">— RECENT</p>
            <h2 class="evo-display text-3xl sm:text-4xl">最近文章</h2>
          </div>
          <a href="articles.html" class="hidden sm:inline-flex items-center gap-1 text-sm text-[var(--evo-ink-3)] hover:text-[var(--evo-cyan)] transition-colors">查看全部 →</a>
        </div>
        <div id="evo-home-recent" class="space-y-4">
          <!-- 由 home.js 渲染 -->
          <div class="text-center py-12 text-[var(--evo-ink-3)]">加载中…</div>
        </div>
      </div>
    </section>
  </main>

  <!-- 共享 Footer -->
  <div id="evo-footer"></div>

  <script type="module" src="/src/scripts/main.js"></script>
  <script type="module" src="/src/scripts/pages/home.js"></script>
</body>
</html>
