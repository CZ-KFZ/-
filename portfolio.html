<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="作品集 — 阴之体道的设计、开发、研究与影像实验集合。" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>作品集 · EchoVerse</title>
</head>
<body class="min-h-screen antialiased">
  <div id="evo-header"></div>

  <main class="pt-16">
    <section class="max-w-7xl mx-auto px-4 sm:px-6 py-10 sm:py-12">
      <div class="text-center max-w-2xl mx-auto mb-10 sm:mb-12 evo-reveal">
        <h1 class="evo-display text-3xl sm:text-4xl md:text-5xl mb-4">作品集</h1>
        <p class="text-[var(--evo-ink-2)]">设计、开发、研究与影像实验的集合</p>
      </div>

      <!-- 搜索栏 -->
      <div class="flex justify-center mb-8 evo-reveal" data-reveal-delay="80">
        <div class="relative w-72">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--evo-ink-3)]" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="evo-portfolio-search" type="text" placeholder="搜索作品标题、简介、分类…"
            class="w-full pl-9 pr-8 py-2 rounded-full bg-[var(--evo-surface-2)]/60 border border-[var(--evo-border)] text-[var(--evo-ink)] placeholder:text-[var(--evo-ink-3)] focus:outline-none focus:ring-1 focus:ring-[var(--evo-purple-400)]/50 transition-all text-xs" />
          <button id="evo-search-clear" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-[var(--evo-ink-3)] hover:text-[var(--evo-ink)] transition-colors" aria-label="清除">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- 筛选条 -->
      <div class="flex flex-wrap justify-center gap-2 sm:gap-3 mb-8 sm:mb-10 evo-reveal" data-reveal-delay="100" id="evo-portfolio-filters">
        <!-- 由 portfolio.js 渲染 -->
      </div>

      <!-- 作品网格 -->
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6" id="evo-portfolio-grid">
        <!-- 由 portfolio.js 渲染 -->
      </div>

      <!-- 空状态 -->
      <div id="evo-portfolio-empty" class="hidden text-center py-16 text-[var(--evo-ink-3)]">
        <p class="text-lg mb-2">🌫️</p>
        <p>这个分类下还没有作品。</p>
      </div>
    </section>
  </main>

  <div id="evo-footer"></div>

  <script type="module" src="/src/scripts/main.js"></script>
  <script type="module" src="/src/scripts/pages/portfolio.js"></script>
</body>
</html>
